[package]
name = "rl-overlay"
version = "0.1.0"
description = "Rocket League overlay fed by the official Stats API"
authors = ["gideo"]
edition = "2021"

[lib]
name = "rl_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Replay parsing is far too slow unoptimised; build just those crates optimised.
[profile.dev.package.boxcars]
opt-level = 2
[profile.dev.package.subtr-actor]
opt-level = 2

[profile.release]
opt-level = 1
codegen-units = 1

[dependencies]
# "unstable" enables child webviews, used to embed RL Tracker in the player screen.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Screen capture (GDI) and Windows' built-in OCR, for reading the boost meter.
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Registry",
  "Win32_UI_Shell",
] }
# Replay parsing (headers, goal frames) and exact boost stats from replays.
boxcars = "0.13"
subtr-actor = "1.5"
dirs = "6"
