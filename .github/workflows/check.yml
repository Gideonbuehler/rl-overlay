# Tests and builds every branch but main (main gets the same checks in Release).

name: Check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      # Type-checks and builds the page, which the app embeds.
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
